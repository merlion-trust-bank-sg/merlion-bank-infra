# Tells Argo CD about the cluster it runs in, and carries facts from Terraform to the add-ons.
#
# bootstrap.sh fills in the ${...} values (from `terraform output`) and applies it. It's a template, so
# don't `kubectl apply` this file directly.
#
# Why it exists: some add-ons need values that only Terraform knows and that change on every rebuild,
# such as the VPC ID. They can't be written into Git, so they're attached to this Secret as
# annotations, and the add-on ApplicationSets read them (cluster generator):
#
#   terraform output vpc_id -> annotation vpc_id here -> {{index .metadata.annotations "vpc_id"}}
#                                                        in deploy/platform/<env>/*.yaml
apiVersion: v1
kind: Secret
metadata:
  name: in-cluster
  namespace: argocd
  labels:
    # Makes Argo CD read this Secret as a cluster it may deploy to
    argocd.argoproj.io/secret-type: cluster
    # The add-on ApplicationSets pick their cluster by this label
    environment: ${ENV}
  annotations:
    # The facts the add-ons need
    cluster_name: ${CLUSTER}
    region: ${REGION}
    vpc_id: ${VPC_ID}
    # Bank of Anthos: database hosts and the Secrets Manager secrets its ExternalSecrets read
    accounts_db_host: ${ACCOUNTS_DB_HOST}
    ledger_db_host: ${LEDGER_DB_HOST}
    accounts_db_secret: ${ACCOUNTS_DB_SECRET}
    ledger_db_secret: ${LEDGER_DB_SECRET}
    jwt_secret: ${JWT_SECRET}
type: Opaque
stringData:
  name: in-cluster
  # The Kubernetes API as seen from inside the cluster. Argo CD runs in this same cluster, so this
  # address always means "this cluster", and no credentials are needed.
  server: https://kubernetes.default.svc
  config: '{"tlsClientConfig":{"insecure":false}}'
