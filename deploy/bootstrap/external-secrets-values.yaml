# External Secrets, installed first by bootstrap.sh (it delivers Argo CD's GitHub credentials) and then
# managed by Argo CD (deploy/platform/<env>/external-secrets.yaml). Both read this file, so the first
# sync doesn't change what the bootstrap installed.
installCRDs: true
serviceAccount:
  # Linked to the external-secrets IAM role by a Pod Identity association (modules/addons)
  name: external-secrets
