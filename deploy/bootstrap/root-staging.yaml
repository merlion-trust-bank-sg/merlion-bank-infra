# "App of apps": Argo CD reads deploy/platform/staging from main and creates every resource in it.
# Argo CD reads the repo with the org's read-only GitHub App (repo-creds.yaml), so it works whether the
# repo is public or private. Pull-based: Argo CD fetches from GitHub; GitHub has no access to the cluster.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: platform # deploy/bootstrap/projects.yaml
  source:
    repoURL: https://github.com/merlion-trust-bank-sg/merlion-bank-infra
    targetRevision: main
    path: deploy/platform/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
