# Secrets Manager -> Kubernetes Secrets, through External Secrets (its role can read only these).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  name: aws-secrets-manager
  labels:
    {{- include "boa.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.secretStore.region }}
      # No auth block: the controller's own Pod Identity role is used
---
# Per database: the RDS-managed master secret holds username and password; the connection strings the
# services expect are built here. sslmode=require because the database only accepts TLS.
{{- range $key, $db := .Values.databases }}
{{- $secret := index $.Values.secrets (printf "%sDb" $key) }}
{{- if not $secret }}{{ fail (printf "secrets.%sDb is not set" $key) }}{{ end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  name: {{ $key }}-db
  labels:
    {{- include "boa.labels" $ | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: {{ $key }}-db
    template:
      engineVersion: v2
      data:
        # Python services (SQLAlchemy)
        ACCOUNTS_DB_URI: "postgresql://{{ "{{" }} .username {{ "}}" }}:{{ "{{" }} .password | urlquery {{ "}}" }}@{{ $db.host }}:5432/{{ $db.name }}?sslmode=require"
        # Java services (Spring)
        SPRING_DATASOURCE_URL: "jdbc:postgresql://{{ $db.host }}:5432/{{ $db.name }}?sslmode=require"
        SPRING_DATASOURCE_USERNAME: "{{ "{{" }} .username {{ "}}" }}"
        SPRING_DATASOURCE_PASSWORD: "{{ "{{" }} .password {{ "}}" }}"
        # Init job (psql)
        PGHOST: {{ $db.host | quote }}
        PGDATABASE: {{ $db.name | quote }}
        PGUSER: "{{ "{{" }} .username {{ "}}" }}"
        PGPASSWORD: "{{ "{{" }} .password {{ "}}" }}"
        PGSSLMODE: require
        POSTGRES_DB: {{ $db.name | quote }}
        POSTGRES_USER: "{{ "{{" }} .username {{ "}}" }}"
        POSTGRES_PASSWORD: "{{ "{{" }} .password {{ "}}" }}"
  dataFrom:
    - extract:
        key: {{ $secret }}
---
{{- end }}
# JWT key pair, mounted as files
{{- if not .Values.secrets.jwt }}{{ fail "secrets.jwt is not set" }}{{ end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  name: jwt-key
  labels:
    {{- include "boa.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: jwt-key
    template:
      engineVersion: v2
      data:
        jwtRS256.key: "{{ "{{" }} .private_key {{ "}}" }}"
        jwtRS256.key.pub: "{{ "{{" }} .public_key {{ "}}" }}"
  dataFrom:
    - extract:
        key: {{ .Values.secrets.jwt }}
