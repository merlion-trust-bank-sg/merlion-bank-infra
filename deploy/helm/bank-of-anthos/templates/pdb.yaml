# Keep at least one pod of each service up during node drains and upgrades. Only for services that
# run 2 or more: with one replica, minAvailable 1 would block the drain until it times out.
{{- range $name, $svc := .Values.services }}
{{- if gt (int (include "boa.minReplicas" $svc)) 1 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
    {{- include "boa.labels" $ | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: {{ $name }}
{{- end }}
{{- end }}
