# Secrets Manager -> Kubernetes Secrets in the monitoring namespace, through External Secrets (INF-16).
# The bot token and passwords are never in Git, in values files or in an image.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  labels:
    {{- include "obs.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.secretStore.region }}
      # No auth block: the controller's own Pod Identity role is used
---
# Mounted into Alertmanager at /etc/alertmanager/secrets/alertmanager-notify/ (alertmanagerSpec.secrets
# in deploy/platform/<env>/kube-prometheus-stack.yaml). The config reads the files by path.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-notify
  labels:
    {{- include "obs.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: alertmanager-notify
  data:
    - secretKey: telegram-bot-token
      remoteRef:
        key: {{ include "obs.alertSecret" . }}
        property: telegram_bot_token
    - secretKey: smtp-password
      remoteRef:
        key: {{ include "obs.alertSecret" . }}
        property: smtp_password
---
# Grafana's admin login (grafana.admin.existingSecret)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  labels:
    {{- include "obs.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: grafana-admin
  data:
    - secretKey: admin-user
      remoteRef:
        key: {{ include "obs.alertSecret" . }}
        property: grafana_admin_user
    - secretKey: admin-password
      remoteRef:
        key: {{ include "obs.alertSecret" . }}
        property: grafana_admin_password
