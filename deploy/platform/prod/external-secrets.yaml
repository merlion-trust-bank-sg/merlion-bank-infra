# Copies secrets from Secrets Manager into Kubernetes Secrets: the app's, and Argo CD's GitHub App key.
# Its AWS permissions (read the listed secrets only) come from the Pod Identity association below.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: external-secrets
  namespace: argocd
spec:
  # Deleting this ApplicationSet must never uninstall External Secrets: Argo CD's own credentials
  # depend on it
  syncPolicy:
    preserveResourcesOnDeletion: true
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            environment: prod
  template:
    metadata:
      name: external-secrets
    spec:
      project: platform # deploy/bootstrap/projects.yaml
      # bootstrap.sh installs this chart first (it delivers Argo CD's GitHub credentials) and reads the
      # version from here; Argo CD then takes it over. Values in deploy/bootstrap/, shared with bootstrap.
      sources:
        - repoURL: https://charts.external-secrets.io
          chart: external-secrets
          targetRevision: 2.14.0
          helm:
            valueFiles:
              - $values/deploy/bootstrap/external-secrets-values.yaml
        - repoURL: https://github.com/merlion-trust-bank-sg/merlion-bank-infra
          targetRevision: '{{index .metadata.annotations "git_revision"}}'
          ref: values
      destination:
        server: '{{.server}}'
        namespace: external-secrets
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          # The CRDs are too large for client-side apply's last-applied annotation
          - ServerSideApply=true
