# Copies secrets from Secrets Manager into Kubernetes Secrets. Its AWS permissions (read the
# RDS-managed secrets only) come from the Pod Identity association on the service account below.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: external-secrets
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            environment: staging
  template:
    metadata:
      name: external-secrets
    spec:
      project: default
      source:
        repoURL: https://charts.external-secrets.io
        chart: external-secrets
        targetRevision: 2.14.0
        helm:
          valuesObject:
            installCRDs: true
            serviceAccount:
              name: external-secrets
      destination:
        server: '{{.server}}'
        namespace: external-secrets
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          # The CRDs are too large for client-side apply's last-applied annotation
          - ServerSideApply=true
