# Creates ALBs from Ingress objects. Its AWS permissions come from the Pod Identity association
# (Terraform, modules/addons) on the service account named below.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: aws-load-balancer-controller
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    # One Application for this cluster, filled in from the annotations bootstrap.sh writes
    - clusters:
        selector:
          matchLabels:
            environment: staging
  template:
    metadata:
      name: aws-load-balancer-controller
    spec:
      project: default
      source:
        repoURL: https://aws.github.io/eks-charts
        chart: aws-load-balancer-controller
        targetRevision: 3.6.2
        helm:
          valuesObject:
            clusterName: '{{index .metadata.annotations "cluster_name"}}'
            # Pods can't reach instance metadata (hop limit 1), so region and VPC are passed in
            region: '{{index .metadata.annotations "region"}}'
            vpcId: '{{index .metadata.annotations "vpc_id"}}'
            serviceAccount:
              name: aws-load-balancer-controller
      destination:
        server: '{{.server}}'
        namespace: kube-system
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
