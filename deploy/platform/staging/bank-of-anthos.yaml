# Bank of Anthos, from our chart (deploy/helm/bank-of-anthos) and the staging values in Git. The
# values that change on every rebuild (database hosts, secret ARNs) come from the cluster annotations
# that deploy/bootstrap/bootstrap.sh writes from `terraform output`.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: bank-of-anthos
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            environment: staging
  template:
    metadata:
      name: bank-of-anthos
    spec:
      project: bank # deploy/bootstrap/projects.yaml: the bank namespace only
      source:
        repoURL: https://github.com/merlion-trust-bank-sg/merlion-bank-infra
        # The same branch as the root app: main normally, a branch when bootstrap.sh is testing one
        targetRevision: '{{index .metadata.annotations "git_revision"}}'
        path: deploy/helm/bank-of-anthos
        helm:
          valueFiles:
            - ../../values-staging.yaml
          valuesObject:
            env: staging
            clusterName: '{{index .metadata.annotations "cluster_name"}}'
            secrets:
              accountsDb: '{{index .metadata.annotations "accounts_db_secret"}}'
              ledgerDb: '{{index .metadata.annotations "ledger_db_secret"}}'
              jwt: '{{index .metadata.annotations "jwt_secret"}}'
            databases:
              accounts:
                host: '{{index .metadata.annotations "accounts_db_host"}}'
              ledger:
                host: '{{index .metadata.annotations "ledger_db_host"}}'
            ingress:
              host: '{{index .metadata.annotations "app_hostname"}}'
              certificateArn: '{{index .metadata.annotations "certificate_arn"}}'
      destination:
        server: '{{.server}}'
        namespace: bank
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
        retry:
          # The first sync can run before the ExternalSecrets have filled in the Secrets
          limit: 10
          backoff: { duration: 15s, factor: 2, maxDuration: 3m }
