# Encrypted gp3 volumes from the EBS CSI driver (EKS add-on, Pod Identity), for Prometheus and Loki.
# Not the cluster default: workloads that want it name it explicitly.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3-encrypted
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
