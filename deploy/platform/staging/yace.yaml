# YACE: CloudWatch metrics in Prometheus: the ALB's for the availability and latency SLOs (APP-14), RDS
# connections for "database unreachable", and the audit log's Firehose delivery (INF-17).
# AWS access through the read-only Pod Identity role on service account "yace" (modules/observability).
# ALBs are found by the elbv2.k8s.aws/cluster tag the LB Controller puts on them.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: yace
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            environment: staging
  template:
    metadata:
      name: yace
    spec:
      project: platform # deploy/bootstrap/projects.yaml
      source:
        repoURL: https://prometheus-community.github.io/helm-charts
        chart: prometheus-yet-another-cloudwatch-exporter
        targetRevision: 0.50.0
        helm:
          valuesObject:
            serviceAccount:
              create: true
              name: yace
            # Helm test pods aren't used with Argo CD
            testConnection: false
            serviceMonitor:
              enabled: true
              interval: 60s
              timeout: 30s
            resources:
              requests:
                cpu: 20m
                memory: 64Mi
              limits:
                memory: 128Mi
            config: |-
              apiVersion: v1alpha1
              sts-region: {{index .metadata.annotations "region"}}
              discovery:
                exportedTagsOnMetrics:
                  AWS/ApplicationELB:
                    - ingress.k8s.aws/stack
                jobs:
                  - type: AWS/ApplicationELB
                    regions:
                      - {{index .metadata.annotations "region"}}
                    searchTags:
                      - key: elbv2.k8s.aws/cluster
                        value: ^{{index .metadata.annotations "cluster_name"}}$
                    period: 60
                    length: 300
                    # One series per load balancer. Without this, CloudWatch's per-AZ and per-target-group
                    # series come back too, and sum() in the SLO rules would count requests several times.
                    dimensionNameRequirements: [LoadBalancer]
                    metrics:
                      - name: RequestCount
                        statistics: [Sum]
                      # CloudWatch publishes no datapoint for a minute without errors. nilToZero turns
                      # that into 0, so the error ratio is 0 instead of missing.
                      - name: HTTPCode_Target_5XX_Count
                        statistics: [Sum]
                        nilToZero: true
                      - name: HTTPCode_ELB_5XX_Count
                        statistics: [Sum]
                        nilToZero: true
                      - name: TargetResponseTime
                        statistics: [p95]
                  # The bank's two databases: no open connections from the app = database unreachable
                  # (INF-17). Team AND Environment tags, because the training account is shared.
                  - type: AWS/RDS
                    regions:
                      - {{index .metadata.annotations "region"}}
                    searchTags:
                      - key: Team
                        value: ^g4$
                      - key: Environment
                        value: ^{{index .metadata.labels "environment"}}$
                    period: 60
                    length: 300
                    nilToZero: true
                    metrics:
                      - name: DatabaseConnections
                        statistics: [Average]
                  # The Kubernetes audit log's copy to the Object Lock bucket (HC-3, #40): records in,
                  # and whether delivery to S3 succeeds. A silent gap would break audit retention.
                  - type: AWS/Firehose
                    regions:
                      - {{index .metadata.annotations "region"}}
                    searchTags:
                      - key: Team
                        value: ^g4$
                      - key: Environment
                        value: ^{{index .metadata.labels "environment"}}$
                    period: 300
                    length: 900
                    metrics:
                      # No datapoint = no records came in: 0 is the right reading
                      - name: IncomingRecords
                        statistics: [Sum]
                        nilToZero: true
                      # Published only when Firehose delivers something. No datapoint = nothing to
                      # deliver, not 0% success, so it must stay missing (no false critical at night).
                      - name: DeliveryToS3.Success
                        statistics: [Average]
                        nilToZero: false
      destination:
        server: '{{.server}}'
        namespace: monitoring
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
