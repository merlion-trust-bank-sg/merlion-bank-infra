# Merge to main: apply staging. Prod is changed only by a release (tf-release-prod.yml).
#
#   apply-staging  environment staging     g4-merlion-ci-staging     runs on every merge
#
# One staging apply at a time (job-level concurrency, never cancelling a run mid-apply).
name: tf-apply

on:
  push:
    branches: [main]
  workflow_dispatch: # re-run on demand, e.g. to rebuild staging

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  apply-staging:
    name: apply staging
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: tf-staging
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: AWS login + Terraform init (staging, deploy role)
        uses: ./.github/actions/terraform-env
        with:
          role: g4-merlion-ci-staging
          workdir: envs/staging

      - name: Terraform plan (staging)
        working-directory: envs/staging
        run: terraform plan -lock-timeout=5m -out=staging.tfplan

      - name: Terraform apply (staging)
        working-directory: envs/staging
        run: terraform apply -lock-timeout=5m staging.tfplan
