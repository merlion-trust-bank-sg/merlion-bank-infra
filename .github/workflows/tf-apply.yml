# Merge to main: apply staging, plan prod, wait for a production reviewer, apply exactly that plan.
#
#   apply-staging  environment staging     g4-merlion-ci-staging     runs on merge
#   plan-prod      no environment          g4-merlion-ci-prod-plan   read-only; plan saved as artifact
#   apply-prod     environment production  g4-merlion-ci-prod        waits for approval, applies the saved plan
#
# One apply per environment at a time (job-level concurrency, never cancelling a run mid-apply).
# Old prod runs can't be applied once main has moved on: both prod jobs check they are for the latest
# commit, and Terraform rejects a saved plan if prod changed after it was made.
name: tf-apply

on:
  push:
    branches: [main]
  workflow_dispatch: # re-run on demand, e.g. after a rejected approval

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  apply-staging:
    name: apply staging
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: tf-staging
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: AWS login + Terraform init (staging, deploy role)
        uses: ./.github/actions/terraform-env
        with:
          role: g4-merlion-ci-staging
          workdir: envs/staging

      - name: Terraform plan (staging)
        working-directory: envs/staging
        run: terraform plan -lock-timeout=5m -out=staging.tfplan

      - name: Terraform apply (staging)
        working-directory: envs/staging
        run: terraform apply -lock-timeout=5m staging.tfplan

      # Terraform can't install into a cluster it creates in the same run, so Argo CD is installed here;
      # Argo CD then installs the add-ons from deploy/platform/staging. Re-running it changes nothing.
      - name: Bootstrap Argo CD (staging)
        run: deploy/bootstrap/bootstrap.sh staging

  plan-prod:
    name: plan prod
    needs: apply-staging
    runs-on: ubuntu-latest
    # No environment on purpose: this job's OIDC sub is ref:refs/heads/main, which only the read-only
    # ci-prod-plan role trusts. Approval happens once, on apply-prod, with this plan in front of the reviewer.
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # whole history: needed to compare this commit with main

      # Never plan prod from an old commit: re-running an old run would plan prod back to older code
      - name: Only the latest commit on main
        run: |
          git fetch --quiet origin main
          latest="$(git rev-parse origin/main)"
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo "::error::This run is for ${GITHUB_SHA::7} but main is now ${latest::7}. Start a new run on main instead."
            exit 1
          fi

      - name: AWS login + Terraform init (prod, read-only role)
        uses: ./.github/actions/terraform-env
        with:
          role: g4-merlion-ci-prod-plan
          workdir: envs/prod

      # -detailed-exitcode: 0 = no changes, 2 = changes, 1 = error. Records whether apply prod is needed.
      - name: Terraform plan (prod)
        id: plan
        working-directory: envs/prod
        run: |
          code=0
          terraform plan -lock-timeout=5m -detailed-exitcode -out=prod.tfplan || code=$?
          [ "$code" -eq 1 ] && exit 1
          echo "changes=$([ "$code" -eq 2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Show prod plan in the run summary
        working-directory: envs/prod
        run: |
          {
            echo "### Terraform plan: prod"
            echo "Commit \`${GITHUB_SHA::7}\`. Approve **apply prod** only if this is what you expect."
            echo '```'
            terraform show -no-color prod.tfplan | tail -c 60000
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The saved plan (and .terraform.lock.hcl) is what apply-prod applies, so the reviewer approves
      # exactly what runs. The plan can contain sensitive values: short retention, never printed.
      - name: Save prod plan for apply prod
        uses: actions/upload-artifact@v7
        if: steps.plan.outputs.changes == 'true'
        with:
          name: prod-tfplan-${{ github.sha }}
          path: |
            envs/prod/prod.tfplan
            envs/prod/.terraform.lock.hcl
          retention-days: 3
          if-no-files-found: error

    outputs:
      changes: ${{ steps.plan.outputs.changes }}

  apply-prod:
    name: apply prod
    needs: plan-prod
    if: needs.plan-prod.outputs.changes == 'true'
    runs-on: ubuntu-latest
    environment: production # required reviewers: GitHub pauses here until someone approves
    concurrency:
      group: tf-prod
      cancel-in-progress: false
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # whole history: needed to compare this commit with main

      # An approval on an old run must not apply: a newer run has the newer plan
      - name: Still the latest commit on main
        run: |
          git fetch --quiet origin main
          latest="$(git rev-parse origin/main)"
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo "::error::main moved to ${latest::7} after this plan. Approve the newer tf-apply run instead."
            exit 1
          fi

      - name: Download the reviewed prod plan
        uses: actions/download-artifact@v8
        with:
          name: prod-tfplan-${{ github.sha }}
          path: envs/prod

      - name: AWS login + Terraform init (prod, deploy role)
        uses: ./.github/actions/terraform-env
        with:
          role: g4-merlion-ci-prod
          workdir: envs/prod

      # Applies the reviewed plan. If prod changed since the plan, Terraform rejects it as stale.
      - name: Terraform apply (prod, saved plan)
        working-directory: envs/prod
        run: terraform apply -lock-timeout=5m prod.tfplan
