# When: a review is submitted or dismissed on the prod promotion PR (promote/prod).
# Why: the "prod promotion only" check (app-image-promote-checks.yml) passes only once someone other
# than whoever ran app-image-promote-prod has approved. GitHub re-runs checks on pushes, not on
# reviews, so without this the check would stay red after the approval that satisfies it.
#
# Why a separate workflow: a review event runs workflows from the PR's branch, so a PR could change
# this file. So it checks nothing itself and runs no code from the PR; it only asks GitHub to re-run
# the existing app-image-promote-checks.yml run for the PR's head commit. A re-run of a
# pull_request_target run executes main's code again, so the check that decides is always main's.
name: app-image-promote-checks-retrigger-on-pr-review

on:
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  actions: write # re-run the promotion check

jobs:
  rerun:
    name: re-run prod promotion check
    if: github.event.pull_request.head.ref == 'promote/prod'
    runs-on: ubuntu-latest
    steps:
      - name: Re-run the prod promotion check
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/app-image-promote-checks.yml/runs?head_sha=$HEAD_SHA&event=pull_request_target&per_page=1" \
            --jq '.workflow_runs[0].id // empty')"
          if [ -z "$run_id" ]; then
            echo "::warning::No promotion check run for $HEAD_SHA yet; it will see this review when it runs."
            exit 0
          fi
          job_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs" \
            --jq '.jobs[] | select(.name == "prod promotion only") | .id')"
          # Wait for a run still in progress, then re-run just the prod job
          for _ in $(seq 1 30); do
            status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq .status)"
            [ "$status" = completed ] && break
            sleep 10
          done
          gh api -X POST "repos/$GITHUB_REPOSITORY/actions/jobs/$job_id/rerun" >/dev/null
          echo "Re-ran 'prod promotion only' (run $run_id) after a review"
