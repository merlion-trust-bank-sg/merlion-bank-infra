# Required on every PR to main, one check per environment ("staging promotion only", "prod promotion
# only"). A promotion PR (from promote/<env>, or opened by a bot and changing deploy/values-<env>.yaml)
# passes only if:
#   1. it changes nothing but image digests in deploy/values-<env>.yaml (check-promotion.py);
#   2. for prod, every digest is one staging already runs on main;
#   3. every digest it sets has build provenance signed by merlion-bank-app's cd on main
#      (verify-provenance.py, Sigstore; read from GitHub's attestation store, no AWS access);
#   4. for prod, someone other than whoever ran promote-prod has approved it (check-prod-approval.py;
#      re-run on every review by promotion-review.yml).
# Like every PR it also needs a teammate's approval: these checks guarantee *what* is promoted, the
# reviewer decides *whether*.
#
# A person's PR that changes deploy/values-<env>.yaml (usually a rollback, i.e. a revert of a
# promotion) is checked too (check-promotion.py --manual): each digest it adds must be one the
# environment ran before, or pass 2 and 3 like a promotion. So a "rollback" can't bring in an unknown
# image. Any other PR passes straight away.
#
# pull_request_target, not pull_request: the workflow and the scripts run from main, so a PR can't
# change the checks it's judged by. The PR's commit is fetched as data only and read with git diff /
# git show; nothing from the PR is run, and the jobs have no secrets and read-only access.
name: promotion

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  attestations: read # merlion-bank-app's build provenance (public, read by digest)

jobs:
  check:
    # The required check names; the rulesets and promotion-review.yml refer to them
    name: ${{ matrix.env }} promotion only
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
      actions: read # prod: who ran the promote-prod run
      pull-requests: read # prod: the PR's reviews
    strategy:
      fail-fast: false # each environment's check reports on its own
      matrix:
        include:
          - env: staging
            same_as: "" # staging takes any digest cd signed
          - env: prod
            same_as: deploy/values-staging.yaml # prod only takes what staging runs
    env:
      VALUES: deploy/values-${{ matrix.env }}.yaml
      SAME_AS: ${{ matrix.same_as }}
      BASE: ${{ github.event.pull_request.base.sha }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      # By branch and by author, so neither a human on the promotion branch nor the App on another
      # branch skips it
      - name: Promotion, manual change, or neither?
        id: kind
        env:
          HEAD_REF: ${{ github.head_ref }}
          AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          BRANCH: promote/${{ matrix.env }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # A bot PR is checked only against the env whose values file it changes, so the staging
          # promotion isn't also judged as a prod one
          files="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename')"
          if [ "$HEAD_REF" = "$BRANCH" ] || { [ "$AUTHOR_TYPE" = Bot ] && grep -qx "$VALUES" <<<"$files"; }; then
            echo "kind=promotion" >> "$GITHUB_OUTPUT"
          elif grep -qx "$VALUES" <<<"$files"; then
            # A person's PR to the env's values, usually a rollback (a revert of a promotion)
            echo "kind=manual" >> "$GITHUB_OUTPUT"
          else
            echo "Doesn't change $VALUES: nothing to check."
          fi

      # main's code (the scripts), full history so the PR's commits can be compared with it
      - name: Checkout main
        if: steps.kind.outputs.kind
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      # The PR's commit, as data only: never checked out, never run
      - name: Fetch the PR's commit
        if: steps.kind.outputs.kind
        run: git fetch --quiet origin "pull/${PR}/head:pr"

      - name: Only allowed digests
        if: steps.kind.outputs.kind
        env:
          MANUAL: ${{ steps.kind.outputs.kind == 'manual' && '--manual' || '' }}
        run: |
          python3 .github/scripts/check-promotion.py "$BASE" pr "$VALUES" $MANUAL \
            ${SAME_AS:+--same-as "$SAME_AS"} --digests-out "$RUNNER_TEMP/digests.txt"

      - name: Set up Python (Sigstore)
        if: steps.kind.outputs.kind
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Sigstore
        if: steps.kind.outputs.kind
        run: python3 -m pip install --quiet "sigstore==4.5.1"

      - name: Every digest signed by cd on main
        if: steps.kind.outputs.kind
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s "$RUNNER_TEMP/digests.txt" ]; then
            xargs python3 .github/scripts/verify-provenance.py < "$RUNNER_TEMP/digests.txt"
          else
            echo "No digest to verify: every digest added ran in $VALUES before."
          fi

      # Someone other than whoever ran promote-prod must approve the current head. GitHub's rules
      # can't do this: the App pushes the commit, so "the last pusher can't approve" compares with the
      # App. Re-run on every review by promotion-review.yml.
      - name: Approved by someone other than who promoted
        if: matrix.env == 'prod' && steps.kind.outputs.kind == 'promotion'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: python3 .github/scripts/check-prod-approval.py pr
