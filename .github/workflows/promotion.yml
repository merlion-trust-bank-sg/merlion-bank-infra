# Required on every PR to main, one job per environment. A promotion PR (from promote/<env>, or opened
# by a bot and changing deploy/values-<env>.yaml) passes only if:
#   1. it changes nothing but image digests in deploy/values-<env>.yaml (check-promotion.py);
#   2. for prod, every digest is one staging already runs on main;
#   3. every digest it sets has build provenance signed by merlion-bank-app's cd on main
#      (verify-provenance.py, Sigstore; read from GitHub's attestation store, no AWS access);
#   4. for prod, someone other than whoever ran promote-prod has approved it (check-prod-approval.py;
#      re-run on every review by promotion-review.yml).
# Like every PR it also needs a teammate's approval: these checks guarantee *what* is promoted, the
# reviewer decides *whether*. Any other PR passes straight away.
#
# pull_request_target, not pull_request: the workflow and the scripts run from main, so a PR can't
# change the checks it's judged by. The PR's commit is fetched as data only and read with git diff /
# git show; nothing from the PR is run, and the jobs have no secrets and read-only access.
name: promotion

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  attestations: read # merlion-bank-app's build provenance (public, read by digest)

jobs:
  staging:
    name: staging promotion only
    runs-on: ubuntu-latest
    steps:
      # By branch and by author, so neither a human on the promotion branch nor the App on another
      # branch skips it
      - name: Is this a promotion PR?
        id: kind
        env:
          HEAD_REF: ${{ github.head_ref }}
          AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          BRANCH: promote/staging
          VALUES: deploy/values-staging.yaml
          BASE: ${{ github.event.pull_request.base.sha }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # A bot PR is checked only against the env whose values file it changes, so the staging
          # promotion isn't also judged as a prod one
          files="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename')"
          if [ "$HEAD_REF" = "$BRANCH" ] || { [ "$AUTHOR_TYPE" = Bot ] && grep -qx "$VALUES" <<<"$files"; }; then
            echo "promotion=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not a promotion PR for $VALUES: nothing to check."
          fi

      # main's code (the scripts), full history so the PR's commits can be compared with it
      - name: Checkout main
        if: steps.kind.outputs.promotion == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      # The PR's commit, as data only: never checked out, never run
      - name: Fetch the PR's commit
        if: steps.kind.outputs.promotion == 'true'
        env:
          PR: ${{ github.event.pull_request.number }}
        run: git fetch --quiet origin "pull/${PR}/head:pr"

      - name: Only digests changed
        if: steps.kind.outputs.promotion == 'true'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          VALUES: deploy/values-staging.yaml
          SAME_AS: "" # staging takes any digest cd signed
        run: |
          python3 .github/scripts/check-promotion.py "$BASE" pr "$VALUES" \
            ${SAME_AS:+--same-as "$SAME_AS"} --digests-out "$RUNNER_TEMP/digests.txt"

      - name: Set up Python (Sigstore)
        if: steps.kind.outputs.promotion == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Sigstore
        if: steps.kind.outputs.promotion == 'true'
        run: python3 -m pip install --quiet "sigstore==4.5.1"

      - name: Every digest signed by cd on main
        if: steps.kind.outputs.promotion == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: xargs python3 .github/scripts/verify-provenance.py < "$RUNNER_TEMP/digests.txt"

  prod:
    name: prod promotion only
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
      actions: read # who ran the promote-prod run
      pull-requests: read # the PR's reviews
    steps:
      # By branch and by author, so neither a human on the promotion branch nor the App on another
      # branch skips it
      - name: Is this a promotion PR?
        id: kind
        env:
          HEAD_REF: ${{ github.head_ref }}
          AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          BRANCH: promote/prod
          VALUES: deploy/values-prod.yaml
          BASE: ${{ github.event.pull_request.base.sha }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # A bot PR is checked only against the env whose values file it changes, so the staging
          # promotion isn't also judged as a prod one
          files="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename')"
          if [ "$HEAD_REF" = "$BRANCH" ] || { [ "$AUTHOR_TYPE" = Bot ] && grep -qx "$VALUES" <<<"$files"; }; then
            echo "promotion=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not a promotion PR for $VALUES: nothing to check."
          fi

      # main's code (the scripts), full history so the PR's commits can be compared with it
      - name: Checkout main
        if: steps.kind.outputs.promotion == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      # The PR's commit, as data only: never checked out, never run
      - name: Fetch the PR's commit
        if: steps.kind.outputs.promotion == 'true'
        env:
          PR: ${{ github.event.pull_request.number }}
        run: git fetch --quiet origin "pull/${PR}/head:pr"

      - name: Only digests changed
        if: steps.kind.outputs.promotion == 'true'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          VALUES: deploy/values-prod.yaml
          SAME_AS: deploy/values-staging.yaml
        run: |
          python3 .github/scripts/check-promotion.py "$BASE" pr "$VALUES" \
            ${SAME_AS:+--same-as "$SAME_AS"} --digests-out "$RUNNER_TEMP/digests.txt"

      - name: Set up Python (Sigstore)
        if: steps.kind.outputs.promotion == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Sigstore
        if: steps.kind.outputs.promotion == 'true'
        run: python3 -m pip install --quiet "sigstore==4.5.1"

      - name: Every digest signed by cd on main
        if: steps.kind.outputs.promotion == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: xargs python3 .github/scripts/verify-provenance.py < "$RUNNER_TEMP/digests.txt"

      # Someone other than whoever ran promote-prod must approve the current head. GitHub's rules
      # can't do this: the App pushes the commit, so "the last pusher can't approve" compares with the
      # App. Re-run on every review by promotion-review.yml.
      - name: Approved by someone other than who promoted
        if: steps.kind.outputs.promotion == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: python3 .github/scripts/check-prod-approval.py pr
