name: setup-gitleaks
description: Install a pinned gitleaks release (checksum-verified). The CLI is free; gitleaks-action needs a licence for organisations.
inputs:
  version:
    description: gitleaks version without the v
    default: "8.30.1"
runs:
  using: composite
  steps:
    - shell: bash
      env:
        V: ${{ inputs.version }}
      run: |
        set -euo pipefail
        base="https://github.com/gitleaks/gitleaks/releases/download/v${V}"
        cd "$(mktemp -d)"
        curl -sSfLO "${base}/gitleaks_${V}_linux_x64.tar.gz"
        curl -sSfLO "${base}/gitleaks_${V}_checksums.txt"
        grep " gitleaks_${V}_linux_x64.tar.gz$" "gitleaks_${V}_checksums.txt" | sha256sum -c -
        tar xzf "gitleaks_${V}_linux_x64.tar.gz" gitleaks
        sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
        gitleaks version
